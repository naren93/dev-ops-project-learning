apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world-api-v8
  namespace: dev
  labels:
    app.kubernetes.io/name: hello-world-api
    app.kubernetes.io/instance: hello-world-api-v8
    app.kubernetes.io/version: "v8"
    app.kubernetes.io/component: backend
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world-api
      app.kubernetes.io/instance: hello-world-api-v8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world-api
        app.kubernetes.io/instance: hello-world-api-v8
        app.kubernetes.io/version: "v8"
    spec:
      containers:
        - name: hello-world-api
          image: ramacrdotnet.azurecr.io/hello-world-api:v8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world-api-v8
  namespace: dev
  labels:
    app.kubernetes.io/name: hello-world-api
    app.kubernetes.io/instance: hello-world-api-v8
    app.kubernetes.io/version: "v8"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: hello-world-api
    app.kubernetes.io/instance: hello-world-api-v8
